services:

  valkey-prod:
    container_name: valkey-prod
    hostname: valkey-prod
    image: valkey/valkey:9.1.1
    user: valkey
    command:
      - sh
      - -c
      - exec valkey-server --save "" --user default on ">$$(cat /run/secrets/valkey_admin_password)" "~*" "+@all" --user agent on ">$$(cat /run/secrets/valkey_agent_password)" "~customer:*" "+@read" "+@connection" "+info"
    secrets:
      - valkey_admin_password
      - valkey_agent_password
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(cat /run/secrets/valkey_admin_password)\" ping | grep PONG"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  # One-shot: loads the demo data as the admin user. The agent's scoped ACL user
  # is read-only, so seeding runs under the broader operator identity.
  seed:
    container_name: agent-seed
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/seed"]
    environment:
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN}
      VALKEY_HOST: "op://Agent Prod/valkey-prod/host"
      VALKEY_PORT: "op://Agent Prod/valkey-prod/port"
      VALKEY_USER: "op://Agent Prod/valkey-prod/username"
      VALKEY_PASSWORD: "op://Agent Prod/valkey-prod/password"
    restart: "no"
    depends_on:
      valkey-prod:
        condition: service_healthy

  # Pulls the model on startup (cached in the volume), then serves. The
  # healthcheck passes only once the model is present, so the backend waits for
  # a ready model rather than just a running server.
  ollama:
    container_name: ollama
    image: ollama/ollama:0.32.5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}
        wait
    environment:
      # Keep the model resident so it never unloads (and reloads slowly) mid-demo.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL:-qwen2.5:7b}'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 600s # first run downloads the model

  backend:
    container_name: agent-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      valkey-prod:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    container_name: agent-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  valkey_admin_password:
    environment: VALKEY_ADMIN_PASSWORD
  valkey_agent_password:
    environment: VALKEY_AGENT_PASSWORD

volumes:
  ollama-data:
